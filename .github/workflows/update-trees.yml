# Once a month: update the planted-tree count on the homepage from Ecodrive.
# Can also be started by hand: GitHub -> Actions -> "Update tree count" -> Run workflow.
name: Update tree count

on:
  schedule:
    - cron: "0 6 3 * *"   # 3rd of every month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the count and update the pages
        run: python .github/scripts/update_trees.py
      - name: Commit if the count changed
        run: |
          if git diff --quiet; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Tree count update from Ecodrive"
          git push
