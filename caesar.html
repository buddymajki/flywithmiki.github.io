<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Caesar! Seize Rome in 20 Minutes - kétnyelvű digitális szólóváltozat">
<title>Caesar! Szóló</title>
<style>
html{color-scheme:light dark}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');
:root{
  --bg:#f2ebdf; --bg2:#fbf7ef; --ink:#2b2119; --ink2:#6d5c4a; --line:#dccfba;
  --panel:#fffdf8; --panel2:#f6efe3;
  --gold:#b0801a; --gold2:#e9c964; --goldbg:#fdf3d6;
  --red:#c0392b; --redl:#e8bcb6; --blue:#2c5fb8; --bluel:#bccce8;
  --land:#93b56c; --land2:#b2cc8e; --sea:#6fb2da; --sea2:#9ed0ea; --neutral:#a2947a; --tied:#d7cdb7;
  --stroke:#27313a; --accent:#9b2c22; --ok:#3d7a38; --warn:#b3611a;
  --shadow:0 2px 10px rgba(70,50,25,.15);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17120e; --bg2:#201913; --ink:#efe6d7; --ink2:#ad9c85; --line:#3b3128;
    --panel:#241d16; --panel2:#2c241b;
    --gold:#d9a93c; --gold2:#f0d78a; --goldbg:#3a2e14;
    --red:#d4483a; --redl:#5a2a24; --blue:#4a80d8; --bluel:#22345c;
    --land:#5d7a45; --land2:#728f56; --sea:#36678a; --sea2:#47809f; --neutral:#453e31; --tied:#6f6555;
    --stroke:#0d1216; --accent:#e0705f; --ok:#6aa85f; --warn:#d8883a;
    --shadow:0 2px 12px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#17120e; --bg2:#201913; --ink:#efe6d7; --ink2:#ad9c85; --line:#3b3128;
  --panel:#241d16; --panel2:#2c241b;
  --gold:#d9a93c; --gold2:#f0d78a; --goldbg:#3a2e14;
  --red:#d4483a; --redl:#5a2a24; --blue:#4a80d8; --bluel:#22345c;
  --land:#5d7a45; --land2:#728f56; --sea:#36678a; --sea2:#47809f; --neutral:#453e31; --tied:#6f6555;
  --stroke:#0d1216; --accent:#e0705f; --ok:#6aa85f; --warn:#d8883a;
  --shadow:0 2px 12px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"EB Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:17px;line-height:1.5}
.disp{font-family:"Cinzel","Iowan Old Style",Georgia,serif}
button{font-family:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2;font-weight:700;letter-spacing:.01em;
  font-family:"Cinzel","Iowan Old Style",Georgia,serif;text-wrap:balance}
.wrap{max-width:1280px;margin:0 auto;padding-block:0 28px;padding-left:14px;padding-right:14px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-bottom:2px solid var(--line);box-shadow:var(--shadow)}
.hdr{max-width:1280px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:23px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;font-family:"Cinzel",Georgia,serif}
.brand span{font-size:11px;letter-spacing:.18em;color:var(--ink2);text-transform:uppercase}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 11px;
  font-size:14.5px;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--gold);background:var(--goldbg)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.prim:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:default}
.lang{display:flex;border:1.5px solid var(--line);border-radius:7px;overflow:hidden}
.lang button{border:0;background:var(--panel);padding:6px 10px;font-size:12px;cursor:pointer;letter-spacing:.06em}
.lang button.on{background:var(--accent);color:#fff}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;margin-top:14px}
.grid>div{min-width:0;max-width:100%}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:11px;padding:11px;box-shadow:var(--shadow)}
.card h3{font-family:"Cinzel",Georgia,serif;font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);
  display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ibtn{width:17px;height:17px;min-width:17px;border-radius:50%;border:1.3px solid var(--gold);background:var(--goldbg);
  color:var(--gold);font-size:11px;line-height:1;cursor:pointer;padding:0;font-weight:700;font-family:Georgia,serif}
.ibtn:hover{background:var(--gold);color:#fff}

/* ---------- board ---------- */
.boardbox{max-width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:11px;padding:6px;box-shadow:var(--shadow);overflow:hidden}
svg.board{display:block;width:100%;height:auto;touch-action:manipulation}
.prov{stroke:var(--stroke);stroke-width:2.2;stroke-linejoin:round;cursor:pointer}
.prov.land{fill:var(--land)}
.prov.sea{fill:var(--sea)}
.prov.neu{fill:var(--neutral)}
.prov.own0{fill:var(--red)}
.prov.own1{fill:var(--blue)}
.prov.closedtie{fill:var(--tied)}
.pname{font-family:"Cinzel",Georgia,serif;font-size:12.5px;letter-spacing:.05em;fill:#fff;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:rgba(20,25,30,.62);stroke-width:2.6px;text-transform:uppercase;font-weight:700}
.pcirc{fill:var(--gold2);stroke:var(--stroke);stroke-width:2;pointer-events:none}
.pcirc.dash{fill:none;stroke-dasharray:5 4}
.sp{cursor:default}
.spbg{fill:#f7f2e7;stroke:var(--stroke);stroke-width:2.4}
.sp.bc .spring{fill:none;stroke:var(--stroke);stroke-width:1.6}
.sp.legal .spbg{stroke:#1f8a3c;stroke-width:3.6;filter:drop-shadow(0 0 5px rgba(40,190,90,.85))}
.sp.legal{cursor:pointer}
.sp.legal:hover .spbg{fill:#dff6e3}
.sp.sel .spbg{stroke:var(--gold);stroke-width:4}
.spicon{fill:var(--stroke);pointer-events:none}
.tok0{fill:var(--red)} .tok1{fill:var(--blue)}
.tokline{stroke:#fff;stroke-width:2.2}
.tokval{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none;font-family:"Cinzel",Georgia,serif}
.ctrlm{stroke:var(--stroke);stroke-width:2}
.flipped{fill:#8e8579}
.lastmark{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:4 3}

/* ---------- hand ---------- */
.hand{display:flex;gap:7px;flex-wrap:wrap}
.tcard{width:60px;border:2px solid var(--line);border-radius:9px;background:var(--panel2);
  padding:4px 3px 3px;cursor:pointer;position:relative;text-align:center;transition:.12s}
.tcard:hover{transform:translateY(-3px);border-color:var(--gold)}
.tcard.on{border-color:var(--gold);background:var(--goldbg);box-shadow:0 0 0 2px var(--gold2)}
.tcard .vals{display:flex;align-items:center;justify-content:center;gap:3px;font-size:18px;font-weight:600;font-family:"Cinzel",Georgia,serif;font-variant-numeric:tabular-nums}
.tcard .vals i{font-style:normal;opacity:.4;font-size:12px}
.tcard .ic{height:22px;display:flex;align-items:center;justify-content:center}
.tcard .ic svg{height:20px;width:20px}
.tcard.s0 .vals{color:var(--red)} .tcard.s1 .vals{color:var(--blue)}
.tcard .cent{position:absolute;top:-6px;right:-5px;background:var(--gold);color:#fff;font-size:9px;
  border-radius:4px;padding:0 3px;letter-spacing:.05em}
.acline{display:flex;gap:6px;flex-wrap:wrap}
.acline .tcard{cursor:default;width:54px}
.acline .tcard:hover{transform:none;border-color:var(--line)}
.acline .tcard.nxt{border-color:var(--warn)}

/* ---------- side panel bits ---------- */
.side{display:flex;flex-direction:column;gap:12px}
.rowline{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:14px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--stroke);flex:none}
.dot.s0{background:var(--red)} .dot.s1{background:var(--blue)}
.big{font-size:21px;font-weight:700;font-family:"Cinzel",Georgia,serif;font-variant-numeric:tabular-nums}
.mini{font-size:13.5px;color:var(--ink2)}
.markers{display:flex;gap:2px;flex-wrap:wrap;margin-top:3px}
.mk{width:10px;height:10px;border-radius:50%;border:1px solid var(--stroke)}
.mk.s0{background:var(--red)} .mk.s1{background:var(--blue)} .mk.used{opacity:.18}
.prompt{border:2px solid var(--gold);background:var(--goldbg);border-radius:10px;padding:9px 10px}
.prompt p{margin:0 0 7px}
.prompt .btn{margin:2px 3px 0 0}
#log{height:190px;overflow-y:auto;font-size:14px;line-height:1.4;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:7px}
#log div{margin-bottom:3px;padding-left:8px;border-left:2.5px solid transparent}
#log .l0{border-left-color:var(--red)} #log .l1{border-left-color:var(--blue)}
#log .ev{border-left-color:var(--gold);background:var(--goldbg);border-radius:0 5px 5px 0;padding:2px 4px 2px 8px}
#log .sys{color:var(--ink2);font-style:italic}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(25,18,10,.62);display:flex;align-items:flex-start;
  justify-content:center;padding:18px 12px;z-index:90;overflow-y:auto}
.modal{overflow:hidden;background:var(--panel);border:2px solid var(--line);border-radius:14px;max-width:760px;width:100%;
  box-shadow:0 12px 40px rgba(0,0,0,.4);margin:auto}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:2px solid var(--line);
  position:sticky;top:0;background:var(--panel);border-radius:12px 12px 0 0;z-index:2}
.mhead h2{margin:0;font-size:19px;letter-spacing:.05em;color:var(--accent);margin-right:auto}
.mbody{padding:14px 16px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:9px 15px 0;border-bottom:2px solid var(--line)}
.tabs button{border:1.5px solid var(--line);border-bottom:none;background:var(--panel2);
  border-radius:8px 8px 0 0;padding:6px 10px;font-size:13.5px;cursor:pointer;font-family:"Cinzel",Georgia,serif}
.tabs button.on{background:var(--panel);border-color:var(--gold);color:var(--accent);font-weight:700}
.mbody h4{margin-top:15px;color:var(--accent);font-size:15px}
.mbody h4:first-child{margin-top:0}
.mbody ul{padding-left:19px;margin:.4em 0}
.mbody li{margin-bottom:.3em}
.mbody{overflow-wrap:anywhere}
.mbody table{border-collapse:collapse;width:100%;font-size:14.5px;margin:.5em 0}
.mbody th,.mbody td{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top}
.mbody th{background:var(--panel2)}
.note{background:var(--goldbg);border-left:3px solid var(--gold);padding:7px 10px;border-radius:0 7px 7px 0;margin:.6em 0;font-size:13.5px}

/* ---------- setup ---------- */
.optrow{margin-bottom:14px}
.optrow>label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:5px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 11px;cursor:pointer;
  font-size:13.5px;transition:.12s;text-align:left}
.chip:hover{border-color:var(--gold)}
.chip.on{border-color:var(--accent);background:var(--goldbg);font-weight:700}
.chip small{display:block;font-weight:400;font-size:13px;color:var(--ink2);max-width:210px;margin-top:2px;line-height:1.3}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.lg{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.lg svg{flex:none;margin-top:1px;max-width:62px;height:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn:focus-visible,.chip:focus-visible,.tcard:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
.tip{position:fixed;z-index:95;max-width:260px;background:var(--panel);border:1.5px solid var(--gold);
  border-radius:9px;padding:7px 9px;font-size:12.5px;box-shadow:var(--shadow);pointer-events:none;display:none}
.tip b{color:var(--accent)}
footer{margin-top:20px;font-size:11.5px;color:var(--ink2);text-align:center;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.scrollhint{display:none}
@media (max-width:760px){
  .boardbox{overflow-x:auto}
  svg.board{min-width:700px}
  .scrollhint{display:block}
}
@media (max-width:520px){
  .brand b{font-size:18px}
  .hdr{gap:6px;padding:7px 10px}
  .btn{padding:5px 8px;font-size:12px}
  .wrap{padding-left:10px;padding-right:10px}
  .tcard{width:54px}
}
</style>
</head>
<body>


<header>
  <div class="hdr">
    <div class="brand"><b>Caesar!</b><span data-i="subtitle">Szólójáték</span></div>
    <div class="lang"><button id="lhu" class="on" onclick="setLang('hu')">HU</button><button id="len" onclick="setLang('en')">EN</button></div>
    <button class="btn" onclick="openRules()" data-i="btnRules">Szabályok</button>
    <button class="btn" onclick="openRules('icons')" data-i="btnIcons">Ikonok</button>
    <button class="btn" onclick="openRules('ai')" data-i="btnAI">Gépi ellenfél</button>
    <button class="btn prim" onclick="openSetup()" data-i="btnNew">Új játék</button>
  </div>
</header>

<div class="wrap">
  <div class="grid">
    <div>
      <div class="boardbox"><div id="boardHost"></div></div>
      <div class="mini scrollhint" style="margin-top:5px" data-i="scrollHint">A tábla oldalra húzható.</div>
      <div class="card" style="margin-top:12px">
        <h3><span data-i="hYourHand">A te kezed</span>
          <button class="ibtn" onclick="openRules('tokens')">i</button>
          <span id="handInfo" class="mini" style="margin-left:auto;text-transform:none;letter-spacing:0"></span>
        </h3>
        <div id="hand" class="hand"></div>
        <div id="centRow" style="margin-top:9px"></div>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <h3><span data-i="hStatus">Állás</span><button class="ibtn" onclick="openRules('end')">i</button></h3>
        <div id="status"></div>
      </div>
      <div id="promptBox"></div>
      <div class="card">
        <h3><span data-i="hOpp">Ellenfél</span><button class="ibtn" onclick="openRules('ai')">i</button></h3>
        <div id="oppBox"></div>
      </div>
      <div class="card">
        <h3><span data-i="hLog">Napló</span></h3>
        <div id="log"></div>
      </div>
    </div>
  </div>

  <footer>
    <div data-i="footLegal">Nem hivatalos, rajongói digitális megvalósítás tanuláshoz és szólójátékhoz.</div>
    <div>Caesar! Seize Rome in 20 Minutes &mdash; Paolo Mori / PSC Games. Expansions of Rome &amp; Solo Mode: D&aacute;vid Turczi, Nick Shaw.</div>
  </footer>
</div>

<div id="tip" class="tip"></div>
<div id="ovl"></div>
<script>
/* ==================== DATA ==================== */
var VB = {w:1000, h:740};

/* junction points of the province network */
var PT = {
 A:[288,205], B:[159,301], C:[291,378], D:[374,303], F:[419,488], G:[414,155], H:[488,229],
 I:[559,337], J:[677,293], K:[720,458], L:[856,478], M:[553,509], N:[710,534], X:[483,405],
 P1:[594,121], P2:[683,162], Q1:[246,529], A1:[390,590], C1:[540,740], E1:[693,740],
 S1:[872,740], R1:[1000,345], T1:[193,0], T2:[410,0], T3:[594,0], G1:[94,195],
 W1:[0,424], W2:[0,311], NW1:[0,195], NE1:[1000,162], NE0:[1000,0], SE:[1000,740],
 GT:[94,0], SWc:[0,528], SWb:[390,740], SW0:[0,740]
};

/* Border spaces: [x, y, icon, provinceA, provinceB, borderControl] */
var SPACES = [
 [227, 74,'sw', 0, 1,0], [411, 77,'st', 1, 2,0], [536,193,'sw', 2, 3,0], [370,194,'sw', 1, 4,0],
 [452,205,'sh', 4, 2,0], [255,232,'st', 0, 5,1], [130,233,'sw', 0, 6,0], [335,252,'st', 5, 4,0],
 [525,297,'st', 4, 3,0], [104,309,'st', 6, 7,0], [614,318,'sw', 3, 9,0], [409,328,'sw', 4,10,0],
 [335,345,'sh', 5,10,0], [254,370,'sh', 5,12,0], [131,376,'sh', 7,12,0], [510,379,'sh', 4, 9,0],
 [700,389,'st', 8,11,0], [352,415,'sh',10,13,0], [903,421,'st', 8,14,0], [276,437,'sw',12,13,0],
 [452,455,'sh',10,15,0], [592,457,'st', 9,11,0], [521,466,'sh', 9,15,0], [782,467,'sh', 8,17,1],
 [717,501,'sh',11,17,0], [637,524,'st',11,16,0], [404,545,'sw',13,15,1], [547,614,'st',15,16,0],
 [863,620,'sw',17,14,0], [702,631,'sw',16,17,0]
];

/* Provinces: key, label pos, extra space pos (Italia), landlocked, polygon spec */
function sp(i){ return [SPACES[i][0],SPACES[i][1]]; }
var PROV = [
 {k:'gallia',    c:[172,146], sea:0, ll:0, poly:['T1',sp(0),'A',sp(5),'B',sp(6),'G1','GT']},
 {k:'galliacis', c:[337, 74], sea:0, ll:0, poly:['T1',sp(0),'A',sp(3),'G',sp(1),'T2']},
 {k:'dalmazia',  c:[522, 77], sea:0, ll:0, poly:['T2',sp(1),'G',sp(4),'H',sp(2),'P1','T3']},
 {k:'macedonia', c:[632,231], sea:0, ll:0, poly:['H',sp(2),'P1','P2','J',sp(10),'I',sp(8)]},
 {k:'italia',    c:[427,258], c2:[466,312], sea:1, ll:1, poly:['A',sp(3),'G',sp(4),'H',sp(8),'I',sp(15),'X',sp(11),'D',sp(7)]},
 {k:'sardegna',  c:[269,307], sea:1, ll:1, poly:['A',sp(7),'D',sp(12),'C',sp(13),'B',sp(5)]},
 {k:'spagnac',   c:[ 69,252], sea:0, ll:0, poly:['B',sp(6),'G1','NW1','W2',sp(9)]},
 {k:'spagnau',   c:[ 69,367], sea:0, ll:0, poly:['B',sp(9),'W2','W1',sp(14)]},
 {k:'asia',      c:[819,352], sea:0, ll:0, poly:['P2','NE1','R1',sp(18),'L',sp(23),'K',sp(16),'J']},
 {k:'acaia',     c:[594,386], sea:1, ll:1, poly:['I',sp(10),'J',sp(21),'M',sp(22),'X',sp(15)]},
 {k:'sicilia',   c:[421,400], sea:1, ll:1, poly:['D',sp(11),'X',sp(20),'F',sp(17),'C',sp(12)]},
 {k:'creta',     c:[672,452], sea:1, ll:1, poly:['J',sp(16),'K',sp(24),'N',sp(25),'M',sp(21)]},
 {k:'mauritania',c:[190,462], sea:0, ll:0, poly:['B',sp(13),'C',sp(19),'Q1','SWc','W1',sp(14)]},
 {k:'numidia',   c:[350,492], sea:0, ll:0, poly:['C',sp(17),'F',sp(26),'A1','Q1',sp(19)]},
 {k:'siria',     c:[939,546], sea:0, ll:0, poly:['R1','SE','S1',sp(28),'L',sp(18)]},
 {k:'africa',    c:[474,658], sea:0, ll:0, poly:['F',sp(20),'X',sp(22),'M',sp(27),'C1','SWb','A1',sp(26)]},
 {k:'cirene',    c:[632,672], sea:0, ll:0, poly:['M',sp(25),'N',sp(29),'E1','C1',sp(27)]},
 {k:'egitto',    c:[800,664], sea:0, ll:0, poly:['K',sp(23),'L',sp(28),'S1','E1',sp(29),'N',sp(24)]}
];
var NEUTRAL = [
 [[0,0],'GT','G1','NW1'],
 ['T3','NE0','NE1','P2','P1'],
 ['SWc','Q1','A1','SWb','SW0']
];
var ITALIA = 4;

/* derived */
var ADJ = [], PSP = [];
(function(){
  for(var i=0;i<PROV.length;i++){ ADJ.push([]); PSP.push([]); }
  for(var s=0;s<SPACES.length;s++){
    var a=SPACES[s][3], b=SPACES[s][4];
    ADJ[a].push(b); ADJ[b].push(a); PSP[a].push(s); PSP[b].push(s);
  }
})();
function polyPts(pl){
  var o=[];
  for(var i=0;i<pl.length;i++){ var v=pl[i]; o.push(typeof v==='string'? PT[v] : v); }
  return o.map(function(p){return p[0]+','+p[1];}).join(' ');
}

/* ---- influence tokens ---- */

 lgSenateNo:function(s){ return sideName(s)+' takes the Senate token but did not win the province, so no markers are placed.'; },
 lgPoison:function(s,t){ return sideName(s)+' gains Poison, '+sideName(t)+' returns a token to their bag.'; },
 lgCent:function(s){ return sideName(s)+' takes a Centurion token, next draw is skipped.'; },
 lgAside:function(s,b){ return sideName(s)+' puts the bonus aside: '+b+'.'; },
 lgHarder:function(s){ return sideName(s)+' removes two unplayed Control markers from the game.'; },
 lgDraw:function(s,n){ return sideName(s)+' draws '+n+' token(s).'; },
 lgDiscard:function(s){ return sideName(s)+' returns their left most token to the bag.'; },
 lgTile:function(t){ return 'Command tile: '+t+'.'; },
 lgReshuffle:'Command tiles ran out, a new stack is shuffled.',
 lgNoMove:function(s){ return sideName(s)+' has no legal placement, the placement is skipped.'; },
 lgBC:function(s,b){ return sideName(s)+' draws and resolves a set aside bonus: '+b+'.'; },
 lgWin:function(s){ return sideName(s)+' placed their last Control marker and wins the game.'; },
 lgPoisonLose:function(s){ return sideName(s)+' starts the turn with an empty hand and loses (Poison).'; },
 lgStuck:'Nobody can move, the game ends.',
 lgMostCtrl:function(s){ return sideName(s)+' wins with more Control markers placed.'; },
 ttFree:'Free Border space', ttOcc:'Occupied Border space', ttCtrl:'Control marker',
 ttBetween:'Provinces', ttInf:'Influence', ttBC:'Border Control space (double ring)',
 ttOpen:'open', ttClosedP:'closed', ttFreeSp:'free space(s)', ttBonus:'Bonus', ttNone:'none',
 ttFlipped:'flipped (0/0)', ttFacedown:'face down (0/0)'
};
function bonusName(b){ return T('b'+b); }
function iconName(ic){ return T('ic'+ic); }
</script>
<script>
/* ==================== ENGINE ==================== */
var S = null;
function rnd(n){ return Math.floor(Math.random()*n); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=rnd(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a){ return a[rnd(a.length)]; }

var TILES = {
  A:['d2','r','x1'], B:['d1','r'], C:['d2','r','r'], D:['c1','r'], E:['d1','c1','r','r']
};
var TILEMIX = {
  0:{ 0:['A','A','A','A','B','B'], 1:['A','A','A','B','B','C'], 2:['A','A','A','A','C','C'] },
  1:{ 0:['A','A','A','A','B','D'], 1:['A','A','B','B','C','D'], 2:['A','A','A','A','C','E'] }
};

function newState(o){
  var st = {
    botType:o.bot, diff:o.diff, exp:{poison:!!o.poison, cent:!!o.cent, border:!!o.border},
    me:o.side, ai:1-o.side,
    bag:[[],[]], hand:[[],[]], centStock:[[],[]], handLim:[2,2], skipDraw:[0,0],
    ctrl:[CTRL_TOTAL,CTRL_TOTAL], placed:[0,0], senate:[0,0], aside:[[],[]],
    bonusAt:[], owner:[], closed:[], ctrlFlip:[],
    sp:[], spCtrl:[], spCtrlFlip:[],
    italia2:-1, italia2Flip:0,
    bonusPool:[], turn:0, extra:0, fx:[], fxSide:0, fxProv:-1,
    brutal:!!o.brutal,
    over:false, winner:-1, reason:'', lastSp:-1, round:0, pending:null, log:[]
  };
  var i;
  for(i=0;i<PROV.length;i++){ st.bonusAt.push(null); st.owner.push(-1); st.closed.push(false); st.ctrlFlip.push(0); }
  for(i=0;i<SPACES.length;i++){ st.sp.push(null); st.spCtrl.push(-1); st.spCtrlFlip.push(0); }

  /* bonus tokens */
  var pool=[], b;
  for(b in BONUS_N){ if(b==='poison'||b==='centurion') continue;
    for(i=0;i<BONUS_N[b];i++) pool.push(b); }
  /* senate on Italia */
  pool.splice(pool.indexOf('senate'),1);
  st.bonusAt[ITALIA]='senate';
  var removeCount=0;
  if(st.exp.poison){ for(i=0;i<3;i++) pool.push('poison'); removeCount+=3; }
  if(st.exp.cent){ for(i=0;i<3;i++) pool.push('centurion'); removeCount+=3; }
  shuffle(pool);
  var removed = pool.splice(0, removeCount);
  if(st.exp.border) st.bonusPool = removed;
  var provs=[]; for(i=0;i<PROV.length;i++) if(i!==ITALIA) provs.push(i);
  shuffle(pool);
  for(i=0;i<provs.length;i++) st.bonusAt[provs[i]] = pool[i];

  /* tokens */
  for(var s=0;s<2;s++){
    var bag=[]; for(i=0;i<NBASE;i++) bag.push(i);
    st.bag[s]=shuffle(bag);
    if(st.exp.cent){ var cs=[]; for(i=0;i<NCENT;i++) cs.push(NBASE+i); st.centStock[s]= (s===st.ai && st.botType==='ac') ? shuffle(cs) : cs; }
    var start = st.exp.poison ? 3 : 2;
    if(s===st.ai && st.botType==='ac') start = 3;
    st.handLim[s] = st.exp.poison ? 3 : 2;
    for(i=0;i<start;i++) if(st.bag[s].length) st.hand[s].push(st.bag[s].pop());
  }
  if(st.botType==='ac'){ st.cmd = {stack: shuffle(TILEMIX[st.exp.cent?1:0][st.diff].slice()), disc:[]}; }
  st.turn = st.ai;   /* Auto-Crassus takes the first turn */
  return st;
}

function cloneS(a){
  var b = {
    botType:a.botType, diff:a.diff, exp:{poison:a.exp.poison,cent:a.exp.cent,border:a.exp.border},
    me:a.me, ai:a.ai,
    bag:[a.bag[0].slice(),a.bag[1].slice()], hand:[a.hand[0].slice(),a.hand[1].slice()],
    centStock:[a.centStock[0].slice(),a.centStock[1].slice()],
    handLim:a.handLim.slice(), skipDraw:a.skipDraw.slice(),
    ctrl:a.ctrl.slice(), placed:a.placed.slice(), senate:a.senate.slice(),
    aside:[a.aside[0].slice(),a.aside[1].slice()],
    bonusAt:a.bonusAt.slice(), owner:a.owner.slice(), closed:a.closed.slice(), ctrlFlip:a.ctrlFlip.slice(),
    sp:new Array(a.sp.length), spCtrl:a.spCtrl.slice(), spCtrlFlip:a.spCtrlFlip.slice(),
    italia2:a.italia2, italia2Flip:a.italia2Flip,
    bonusPool:a.bonusPool.slice(), turn:a.turn, extra:a.extra, fx:[], fxSide:a.fxSide, fxProv:a.fxProv,
    brutal:a.brutal,
    over:a.over, winner:a.winner, reason:a.reason, lastSp:a.lastSp, round:a.round, pending:null, log:[]
  };
  for(var i=0;i<a.sp.length;i++){ var t=a.sp[i]; b.sp[i] = t? {s:t.s,t:t.t,a:t.a,b:t.b,f:t.f,d:t.d} : null; }
  if(a.cmd) b.cmd={stack:a.cmd.stack.slice(), disc:a.cmd.disc.slice()};
  return b;
}

function LOG(st, cls, txt){ if(st.silent) return; st.log.push({c:cls, t:txt}); if(st.log.length>140) st.log.shift(); }

/* ---- queries ---- */
function influence(st, p){
  var t=[0,0], list=PSP[p], i;
  for(i=0;i<list.length;i++){
    var k=list[i], o=st.sp[k];
    if(!o || o.f || o.d) continue;
    t[o.s] += (SPACES[k][3]===p) ? o.a : o.b;
  }
  return t;
}
function freeSpaces(st, p){
  var n=0, list=PSP[p];
  for(var i=0;i<list.length;i++) if(!st.sp[list[i]]) n++;
  return n;
}
function isOpen(st,p){ return !st.closed[p]; }
function legalMoves(st, side){
  var out=[], h=st.hand[side], i, j;
  for(i=0;i<h.length;i++) for(j=0;j<SPACES.length;j++)
    if(!st.sp[j] && tokFits(h[i], j)) out.push([i,j]);
  return out;
}
function canPlace(st, side){
  var h=st.hand[side], i, j;
  for(i=0;i<h.length;i++) for(j=0;j<SPACES.length;j++) if(!st.sp[j] && tokFits(h[i],j)) return true;
  return false;
}
function boardFull(st){ for(var i=0;i<SPACES.length;i++) if(!st.sp[i]) return false; return true; }

/* ---- markers ---- */
function useMarker(st, side){
  if(st.over) return false;
  if(st.ctrl[side]<=0) return false;
  st.ctrl[side]--; st.placed[side]++;
  if(st.ctrl[side]===0){ st.over=true; st.winner=side; st.reason='markers'; LOG(st,'ev',TF('lgWin',side)); }
  return true;
}

/* ---- draw ---- */
function drawTokens(st, side, n){
  var got=0;
  for(var i=0;i<n;i++){
    if(!st.bag[side].length) break;
    st.hand[side].push(st.bag[side].pop()); got++;
  }
  if(got) LOG(st,'l'+side, TF('lgDraw', side, got));
  return got;
}

/* ---- placement ---- */
function placeToken(st, side, spIdx, handIdx, orient, faceDown, ctx){
  ctx = ctx || {};
  var tid = st.hand[side][handIdx];
  st.hand[side].splice(handIdx,1);
  var d = TOKDEF[tid];
  var va = orient===0 ? d.v[0] : d.v[1];
  var vb = orient===0 ? d.v[1] : d.v[0];
  st.sp[spIdx] = {s:side, t:tid, a:va, b:vb, f:0, d:faceDown?1:0};
  st.lastSp = spIdx;
  var pa=SPACES[spIdx][3], pb=SPACES[spIdx][4];
  if(faceDown) LOG(st,'l'+side, TF('lgPlaceDown', side, PN(pa), PN(pb)));
  else LOG(st,'l'+side, TF('lgPlace', side, iconName(d.ic), va, PN(pa), vb, PN(pb)));

  st.fx=[]; st.fxSide=side; st.extra=0;
  if(faceDown && st.bonusPool.length){
    var bb = st.bonusPool.splice(rnd(st.bonusPool.length),1)[0];
    LOG(st,'ev', TF('lgBC', side, bonusName(bb)));
    st.fx.push({b:bb, p:-1});
  }
  resolveClosings(st, side);
  return pumpFx(st, ctx);
}

function resolveClosings(st, side){
  var newly=[], p;
  for(p=0;p<PROV.length;p++) if(!st.closed[p] && freeSpaces(st,p)===0) newly.push(p);
  if(!newly.length) return;
  var i;
  for(i=0;i<newly.length;i++){ st.closed[newly[i]]=true; LOG(st,'ev', TF('lgClosed', PN(newly[i]))); }
  /* 1. placer takes all bonus tokens */
  var taken=[];
  for(i=0;i<newly.length;i++){
    p=newly[i];
    if(st.bonusAt[p]){ taken.push({b:st.bonusAt[p], p:p}); LOG(st,'l'+side, TF('lgBonus', side, bonusName(st.bonusAt[p]), PN(p))); st.bonusAt[p]=null; }
  }
  /* 2. control markers */
  for(i=0;i<newly.length && !st.over;i++){
    p=newly[i];
    var t=influence(st,p);
    var w=-1;
    if(t[0]>t[1]) w=0; else if(t[1]>t[0]) w=1;
    else if(st.botType==='ac' && (t[0]+t[1])>=0) w=st.ai;   /* Auto-Crassus always wins ties */
    var wasTie = (t[0]===t[1]);
    if(w<0){ LOG(st,'ev', TF('lgTie', PN(p), t[0])); continue; }
    st.owner[p]=w;
    LOG(st,'ev', wasTie ? TF('lgCtrlTie', w, PN(p), t[0]) : TF('lgCtrl', w, PN(p), t[w], t[1-w]));
    if(!useMarker(st,w)) { st.owner[p]=-1; continue; }
    if(p===ITALIA && !st.over){ st.italia2=w; LOG(st,'ev', TF('lgItalia', w)); useMarker(st,w); }
    if(st.over) break;
    /* adjacency bonus */
    var nb=ADJ[p];
    for(var j=0;j<nb.length && !st.over;j++){
      var q=nb[j];
      if(st.owner[q]!==w) continue;
      if(st.ctrlFlip[p] || st.ctrlFlip[q]) continue;
      var k=spBetween(p,q);
      if(k<0 || st.spCtrl[k]>=0) continue;
      st.spCtrl[k]=w;
      LOG(st,'ev', TF('lgAdj', w, PN(p), PN(q)));
      useMarker(st,w);
    }
  }
  /* 3. bonus effects */
  for(i=0;i<taken.length;i++) st.fx.push(taken[i]);
}
function spBetween(p,q){
  for(var i=0;i<SPACES.length;i++){
    if((SPACES[i][3]===p&&SPACES[i][4]===q)||(SPACES[i][3]===q&&SPACES[i][4]===p)) return i;
  }
  return -1;
}

/* ---- bonus effects ---- */
function pumpFx(st, ctx){
  while(st.fx.length){
    if(st.over){ st.fx=[]; return true; }
    var f = st.fx.shift();
    var r = applyBonus(st, st.fxSide, f.b, f.p, ctx);
    if(r==='wait'){ return false; }
  }
  return true;
}
function flipTargets(st, side){
  var opp=1-side, out=[], i;
  for(i=0;i<SPACES.length;i++){
    var o=st.sp[i];
    if(o && o.s===opp && !o.f && !o.d) out.push({k:'inf', i:i});
    if(st.spCtrl[i]===opp && !st.spCtrlFlip[i]) out.push({k:'spc', i:i});
  }
  for(i=0;i<PROV.length;i++) if(st.owner[i]===opp && !st.ctrlFlip[i]) out.push({k:'prov', i:i});
  if(st.italia2===opp && !st.italia2Flip) out.push({k:'it2', i:ITALIA});
  return out;
}
function doFlip(st, side, tg){
  if(tg.k==='inf'){ st.sp[tg.i].f=1; return T('ttInf')+' '+PN(SPACES[tg.i][3])+'/'+PN(SPACES[tg.i][4]); }
  if(tg.k==='spc'){ st.spCtrlFlip[tg.i]=1; return T('ttCtrl')+' '+PN(SPACES[tg.i][3])+'/'+PN(SPACES[tg.i][4]); }
  if(tg.k==='it2'){ st.italia2Flip=1; return T('ttCtrl')+' '+PN(ITALIA); }
  st.ctrlFlip[tg.i]=1; return T('ttCtrl')+' '+PN(tg.i);
}
function autoFlipChoice(st, side, tg){
  /* prefer the opponent influence token that swings the biggest open province */
  var best=null, bv=-1;
  for(var i=0;i<tg.length;i++){
    var t=tg[i], v=0;
    if(t.k==='inf'){
      var o=st.sp[t.i];
      var pa=SPACES[t.i][3], pb=SPACES[t.i][4];
      if(isOpen(st,pa)) v+=o.a*(SPACES[t.i][3]===pa?1:1)*2;
      if(isOpen(st,pb)) v+=o.b*2;
      v += (o.a+o.b)*0.2;
    } else v = 3;
    if(v>bv){ bv=v; best=t; }
  }
  return best;
}
function applyBonus(st, side, b, p, ctx){
  ctx = ctx||{};
  var opp=1-side;
  /* Auto-Crassus just puts Might / Wealth / Tactics / Centurion aside */
  if(st.botType==='ac' && side===st.ai && (b==='tactics'||b==='wealth'||b==='might'||b==='centurion')){
    st.aside[side].push(b); LOG(st,'l'+side, TF('lgAside', side, bonusName(b)));
    acHarder(st, side, p); return 'ok';
  }
  if(b==='tactics'){ st.extra=1; LOG(st,'ev', TF('lgTactics', side)); return 'ok'; }
  if(b==='wealth'){ st.handLim[side]++; LOG(st,'ev', TF('lgWealth', side, st.handLim[side])); drawTokens(st,side,1); return 'ok'; }
  if(b==='senate'){
    st.senate[side]++;
    if(p>=0 && st.owner[p]===side){
      var n=st.senate[side], k;
      LOG(st,'ev', TF('lgSenate', side, n));
      for(k=0;k<n && !st.over;k++) useMarker(st,side);
    } else LOG(st,'ev', TF('lgSenateNo', side));
    return 'ok';
  }
  if(b==='poison'){
    if(st.hand[opp].length){
      var idx=rnd(st.hand[opp].length);
      st.bag[opp].push(st.hand[opp].splice(idx,1)[0]); shuffle(st.bag[opp]);
    }
    LOG(st,'ev', TF('lgPoison', side, opp));
    return 'ok';
  }
  if(b==='might'){
    var tg=flipTargets(st, side);
    if(!tg.length){ LOG(st,'ev', TF('lgMightNone', side)); return 'ok'; }
    if(side===st.me && !ctx.auto){ st.pending={type:'might', targets:tg}; return 'wait'; }
    var ch=autoFlipChoice(st, side, tg);
    LOG(st,'ev', TF('lgMight', side, doFlip(st, side, ch)));
    return 'ok';
  }
  if(b==='centurion'){
    if(!st.centStock[side].length){ return 'ok'; }
    if(side===st.me && !ctx.auto && st.centStock[side].length>1){ st.pending={type:'cent'}; return 'wait'; }
    takeCent(st, side, 0);
    return 'ok';
  }
  return 'ok';
}
function takeCent(st, side, idx){
  var id = st.centStock[side].splice(idx,1)[0];
  st.hand[side].push(id);
  st.skipDraw[side]++;
  LOG(st,'ev', TF('lgCent', side));
}
function acHarder(st, side, p){
  /* "For an even harder game": AC removes 2 unplayed control tokens when it also won the region */
  if(!st.brutal || st.botType!=='ac') return;
  if(p<0 || st.owner[p]!==side) return;
  var n=Math.min(2, st.ctrl[side]);
  for(var i=0;i<n && !st.over;i++){ st.ctrl[side]--; if(st.ctrl[side]===0){ st.over=true; st.winner=side; st.reason='markers'; LOG(st,'ev',TF('lgWin',side)); } }
  if(n) LOG(st,'ev', TF('lgHarder', side));
}

/* ---- turn end ---- */
function endTurnDraw(st, side){
  if(st.skipDraw[side]>0){ st.skipDraw[side]--; return; }
  if(st.hand[side].length >= st.handLim[side]) return;
  drawTokens(st, side, 1);
}
</script>
<script>
/* ==================== BOTS ==================== */
function valTo(tid, orient, spIdx, p){
  var d=TOKDEF[tid], v0 = orient===0? d.v[0] : d.v[1], v1 = orient===0? d.v[1] : d.v[0];
  return SPACES[spIdx][3]===p ? v0 : v1;
}
function closesList(st, spIdx){
  var o=[], pa=SPACES[spIdx][3], pb=SPACES[spIdx][4];
  if(!st.closed[pa] && freeSpaces(st,pa)===1) o.push(pa);
  if(!st.closed[pb] && freeSpaces(st,pb)===1) o.push(pb);
  return o;
}
function simPlace(st, side, spIdx, handIdx, orient){
  var s2=cloneS(st); s2.silent=true;
  placeToken(s2, side, spIdx, handIdx, orient, false, {auto:true});
  return s2;
}
function acPresent(st, p, side){
  var l=PSP[p];
  for(var i=0;i<l.length;i++){ var o=st.sp[l[i]]; if(o && o.s===side && !o.f && !o.d) return true; }
  return false;
}
function deficit(st, p, side){ var t=influence(st,p); return t[1-side]-t[side]; }

/* ---- region / space / token tie breakers ---- */
function regionRank(st, p, side){
  var adjWon=0, adjLL=0, i;
  for(i=0;i<ADJ[p].length;i++){ if(st.owner[ADJ[p][i]]===side) adjWon=1; if(PROV[ADJ[p][i]].ll) adjLL=1; }
  var sen = st.bonusAt[p]==='senate' ?1:0;
  var poi = (st.exp.poison && st.bonusAt[p]==='poison') ?1:0;
  return [1-adjWon, 1-sen, 1-poi, 1-(PROV[p].ll?1:0), 1-adjLL];
}
function cmpArr(a,b){ for(var i=0;i<a.length;i++){ if(a[i]!==b[i]) return a[i]-b[i]; } return 0; }
function spaceRank(st, spIdx, p, side){
  var other = SPACES[spIdx][3]===p ? SPACES[spIdx][4] : SPACES[spIdx][3];
  var d = (!st.closed[other]) ? deficit(st, other, side) : -99;
  var adjLL = PROV[other].ll ?1:0;
  return [-d, 1-adjLL];
}
function tokenRank(st, side, tid, handIdx){
  return [ isWild(tid)?1:0, 0, handIdx ];
}
function chooseBest(list, cmp){
  if(!list.length) return null;
  var best=[list[0]];
  for(var i=1;i<list.length;i++){
    var c=cmp(list[i], best[0]);
    if(c<0) best=[list[i]]; else if(c===0) best.push(list[i]);
  }
  return pick(best);
}

/* choose placement inside a chosen region, taking highest (or lowest) value token */
function acPlaceInRegion(st, side, p, wantHigh){
  var cands=[], l=PSP[p], i, j, o;
  for(i=0;i<l.length;i++){
    var s=l[i]; if(st.sp[s]) continue;
    for(j=0;j<st.hand[side].length;j++){
      var tid=st.hand[side][j]; if(!tokFits(tid,s)) continue;
      for(o=0;o<2;o++){
        var v=valTo(tid,o,s,p);
        cands.push({h:j, sp:s, o:o, v:v, tid:tid});
      }
    }
  }
  if(!cands.length) return null;
  var target = wantHigh ? Math.max.apply(null,cands.map(function(c){return c.v;}))
                        : Math.min.apply(null,cands.map(function(c){return c.v;}));
  cands = cands.filter(function(c){ return c.v===target; });
  return chooseBest(cands, function(a,b){
    var r = cmpArr(spaceRank(st,a.sp,p,side), spaceRank(st,b.sp,p,side)); if(r) return r;
    if(isWild(a.tid)!==isWild(b.tid)) return isWild(a.tid)?1:-1;
    var sa=tsum(a.tid), sb=tsum(b.tid);
    if(sa!==sb) return wantHigh ? sb-sa : sa-sb;
    return a.h-b.h;
  });
}
function bestTokenValueIn(st, side, p){
  var l=PSP[p], best=-1, i,j,o;
  for(i=0;i<l.length;i++){ var s=l[i]; if(st.sp[s]) continue;
    for(j=0;j<st.hand[side].length;j++){ var tid=st.hand[side][j]; if(!tokFits(tid,s)) continue;
      for(o=0;o<2;o++){ var v=valTo(tid,o,s,p); if(v>best) best=v; } } }
  return best;
}
function regionPlaceable(st, side, p){ return bestTokenValueIn(st, side, p) >= 0; }

/* ---- the official Auto-Crassus placement choice ---- */
function acPick(st){
  var side=st.ai, me=st.me, i, j, o, p;
  var hand=st.hand[side];
  if(!hand.length || !canPlace(st, side)) return null;

  /* 1 + 2: closing moves */
  var winC=[], closeC=[];
  for(var s=0;s<SPACES.length;s++){
    if(st.sp[s]) continue;
    var cl=closesList(st,s);
    if(!cl.length) continue;
    for(j=0;j<hand.length;j++){
      var tid=hand[j]; if(!tokFits(tid,s)) continue;
      for(o=0;o<2;o++){
        var sim=simPlace(st, side, s, j, o);
        var won=false, closedAny=false;
        for(i=0;i<cl.length;i++){ closedAny=true; if(sim.owner[cl[i]]===side) won=true; }
        if(!closedAny) continue;
        var vIn = Math.min.apply(null, cl.map(function(pp){ return valTo(tid,o,s,pp); }));
        var rec={h:j, sp:s, o:o, tid:tid, v:vIn, cl:cl, sim:sim};
        if(won) winC.push(rec);
        else if(!(sim.over && sim.winner===me)) closeC.push(rec);
      }
    }
  }
  function lowCmp(a,b){
    if(a.v!==b.v) return a.v-b.v;
    var ra=regionRank(st,a.cl[0],side), rb=regionRank(st,b.cl[0],side);
    var r=cmpArr(ra,rb); if(r) return r;
    if(isWild(a.tid)!==isWild(b.tid)) return isWild(a.tid)?1:-1;
    if(tsum(a.tid)!==tsum(b.tid)) return tsum(a.tid)-tsum(b.tid);
    return a.h-b.h;
  }
  if(winC.length) return chooseBest(winC, lowCmp);
  if(closeC.length) return chooseBest(closeC, lowCmp);

  /* open regions where AC can still place */
  var open=[];
  for(p=0;p<PROV.length;p++) if(!st.closed[p] && regionPlaceable(st,side,p)) open.push(p);
  if(!open.length) return null;

  /* 3: losing the most */
  var losing = open.filter(function(pp){ return deficit(st,pp,side)>0; });
  if(losing.length){
    var mx = Math.max.apply(null, losing.map(function(pp){ return deficit(st,pp,side); }));
    var cand = losing.filter(function(pp){ return deficit(st,pp,side)===mx; });
    p = chooseBest(cand, function(a,b){ return cmpArr(regionRank(st,a,side), regionRank(st,b,side)); });
    return acPlaceInRegion(st, side, p, true);
  }
  /* 4: present, closest to winning */
  var present = open.filter(function(pp){ return acPresent(st,pp,side); });
  if(present.length){
    var mn = Math.min.apply(null, present.map(function(pp){ return -deficit(st,pp,side); }));
    var c4 = present.filter(function(pp){ return -deficit(st,pp,side)===mn; });
    p = chooseBest(c4, function(a,b){
      var fa=freeSpaces(st,a), fb=freeSpaces(st,b); if(fa!==fb) return fa-fb;
      return cmpArr(regionRank(st,a,side), regionRank(st,b,side)); });
    return acPlaceInRegion(st, side, p, true);
  }
  /* 5: adjacent to a region they control */
  var adjOwn = open.filter(function(pp){
    for(var k=0;k<ADJ[pp].length;k++) if(st.owner[ADJ[pp][k]]===side) return true; return false; });
  if(adjOwn.length){
    p = chooseBest(adjOwn, function(a,b){
      var r=cmpArr(regionRank(st,a,side), regionRank(st,b,side)); if(r) return r;
      return bestTokenValueIn(st,side,b)-bestTokenValueIn(st,side,a); });
    return acPlaceInRegion(st, side, p, true);
  }
  /* 6: land locked region */
  var ll = open.filter(function(pp){ return PROV[pp].ll; });
  if(ll.length){
    p = (ll.indexOf(ITALIA)>=0) ? ITALIA : pick(ll);
    return acPlaceInRegion(st, side, p, true);
  }
  /* 7: any remaining */
  p = pick(open);
  return acPlaceInRegion(st, side, p, true);
}

/* ---- Auto-Crassus full turn (command tiles) ---- */
function acAllTiles(st){ return TILEMIX[st.exp.cent?1:0][st.diff].slice(); }
function acTurnSteps(st){
  if(!st.cmd.stack.length){ st.cmd.stack = shuffle(acAllTiles(st)); st.cmd.disc=[]; LOG(st,'sys', T('lgReshuffle')); }
  var tile = st.cmd.stack.pop();
  LOG(st,'l'+st.ai, TF('lgTile', tile));
  var acts = TILES[tile], side=st.ai;
  for(var i=0;i<acts.length;i++){
    if(st.over) break;
    var a=acts[i];
    if(a==='d1') drawTokens(st, side, 1);
    else if(a==='d2') drawTokens(st, side, 2);
    else if(a==='c1'){ if(st.centStock[side].length){ st.hand[side].push(st.centStock[side].pop()); LOG(st,'l'+side, TF('lgDraw', side, 1)); } }
    else if(a==='r'){
      var mv = acPick(st);
      if(!mv){ LOG(st,'sys', TF('lgNoMove', side)); }
      else placeToken(st, side, mv.sp, mv.h, mv.o, false, {auto:true});
    }
    else if(a==='x1'){
      if(st.hand[side].length){ st.bag[side].push(st.hand[side].shift()); shuffle(st.bag[side]); LOG(st,'l'+side, TF('lgDiscard', side)); }
    }
  }
  if(!st.cmd.stack.length){ st.cmd.stack = shuffle(acAllTiles(st)); st.cmd.disc=[]; }
  else st.cmd.disc.push(tile);
}

/* ---- evaluation for the search bot ---- */
function provValue(st, p, side){
  var v = 11;
  if(p===ITALIA) v += 9;
  var b = st.bonusAt[p];
  if(b==='senate') v += 8 + 6*(st.senate[side]+1);
  else if(b==='tactics') v += 5;
  else if(b==='wealth') v += 3;
  else if(b==='might') v += 3;
  else if(b==='poison') v += 4;
  else if(b==='centurion') v += 4;
  for(var i=0;i<ADJ[p].length;i++) if(st.owner[ADJ[p][i]]===side) v += 7;
  return v;
}
function evaluate(st, side){
  var opp=1-side, v=0, p;
  if(st.over) return st.winner===side ? 100000 : (st.winner<0 ? 0 : -100000);
  v += (st.ctrl[opp]-st.ctrl[side]) * 34;
  v += (st.senate[side]-st.senate[opp]) * 10;
  for(p=0;p<PROV.length;p++){
    if(st.closed[p]) continue;
    var f=freeSpaces(st,p);
    var t=influence(st,p);
    var lead=t[side]-t[opp];
    var w = lead/(3+2.2*f);
    if(w>1) w=1; if(w<-1) w=-1;
    var pv = provValue(st,p,side);
    v += w*pv;
    if(f===0) v += (lead>=0?1:-1)*pv*0.4;
  }
  var hq=0, i;
  for(i=0;i<st.hand[side].length;i++){ var d=TOKDEF[st.hand[side][i]]; hq += Math.max(d.v[0],d.v[1])*0.55 + (isWild(st.hand[side][i])?1.4:0); }
  v += hq;
  return v;
}
function rankMoves(st, side, keepSim){
  var cands=[], h=st.hand[side], j, s, o;
  for(j=0;j<h.length;j++) for(s=0;s<SPACES.length;s++){
    if(st.sp[s] || !tokFits(h[j], s)) continue;
    for(o=0;o<2;o++){
      var sim=simPlace(st, side, s, j, o);
      var val=evaluate(sim, side);
      if(sim.extra) val += 9;
      cands.push({h:j, sp:s, o:o, v:val, sim: keepSim? sim : null});
    }
  }
  cands.sort(function(a,b){ return b.v-a.v; });
  return cands;
}
function searchPick(st, side, slack){
  var cands = rankMoves(st, side, false);
  if(!cands.length) return null;
  var k = Math.min(slack, cands.length);
  return cands[rnd(k)];
}
/* two ply: my move, then the opponent best reply */
function deepPick(st, side, K){
  var cands = rankMoves(st, side, true);
  if(!cands.length) return null;
  var top = cands.slice(0, Math.min(K, cands.length));
  var best=null, bv=-1e18, i;
  for(i=0;i<top.length;i++){
    var sim=top[i].sim, v;
    if(sim.over) v = evaluate(sim, side);
    else {
      var s2=cloneS(sim); s2.silent=true;
      if(!s2.extra) { endTurnDraw(s2, side);
        var om = searchPick(s2, 1-side, 1);
        if(om) placeToken(s2, 1-side, om.sp, om.h, om.o, false, {auto:true});
      }
      v = evaluate(s2, side);
      if(sim.extra) v += 9;
    }
    if(v>bv){ bv=v; best=top[i]; }
  }
  return {h:best.h, sp:best.sp, o:best.o};
}
var SLACK = {strat:[4,2,1], novice:[12,6,3]};
function botPick(st){
  var side=st.ai;
  if(st.botType==='strat'){
    if(st.diff===2) return deepPick(st, side, 12);
    return searchPick(st, side, SLACK.strat[st.diff]);
  }
  if(st.botType==='novice') return searchPick(st, side, SLACK.novice[st.diff]);
  return null;
}

}
function renderAll(){

<script>
/* ==================== FLOW & UI ==================== */
function clearSel(){ UI.sel=-1; UI.selSp=-1; renderAll(); }
function selTok(i){
  if(!S || S.over || S.turn!==S.me || S.pending) return;
  UI.sel = (UI.sel===i? -1 : i); UI.selSp=-1; renderAll();
}
function doPlace(o){
  if(!S || UI.selSp<0 || UI.sel<0) return;
  var sp=UI.selSp, h=UI.sel, fd=false;
  if(o===-1){ fd=true; o=0; }
  UI.sel=-1; UI.selSp=-1; S.skips=0;
  var done = placeToken(S, S.me, sp, h, o, fd, {});
  if(!done){ renderAll(); return; }
  finishPlayerTurn();
}
function doMight(i){
  if(!S || !S.pending || S.pending.type!=='might') return;
  var tg=S.pending.targets[i];
  LOG(S,'ev', TF('lgMight', S.me, doFlip(S, S.me, tg)));
  afterPending();
}
function pickCent(i){
  if(!S || !S.pending || S.pending.type!=='cent') return;
  takeCent(S, S.me, i);
  afterPending();
}
function afterPending(){
  S.pending=null;
  if(pumpFx(S, {})) finishPlayerTurn(); else renderAll();
}
function finishPlayerTurn(){
  if(S.over){ renderAll(); return; }
  endTurnDraw(S, S.me);
  if(S.extra){ S.extra=0; renderAll(); return; }
  S.turn = S.ai;
  renderAll();
  setTimeout(beginTurn, 380);
}
function endStuck(){
  S.over=true;
  if(S.placed[0]===S.placed[1]) { S.winner=-1; LOG(S,'ev', T('lgStuck')); }
  else { S.winner = S.placed[0]>S.placed[1]?0:1; LOG(S,'ev', T('lgStuck')); LOG(S,'ev', TF('lgMostCtrl', S.winner)); }
  renderAll();
}
function beginTurn(){
  if(!S) return;
  if(S.over){ renderAll(); return; }
  var s=S.turn;
  if(S.exp.poison && S.hand[s].length===0){
    S.over=true; S.winner=1-s; S.reason='poison';
    LOG(S,'ev', TF('lgPoisonLose', s)); renderAll(); return;
  }
  if(s===S.me){
    if(!canPlace(S,S.me)){
      LOG(S,'sys', TF('lgNoMove', S.me));
      S.skips=(S.skips||0)+1;
      if(S.skips>=4){ endStuck(); return; }
      finishPlayerTurn(); return;
    }
    renderAll(); return;
  }
  botTurn();
}
function botTurn(){
  if(S.over){ renderAll(); return; }
  var guard=0, moved=false;
  if(S.botType==='ac'){
    var before=[];
    for(var q=0;q<SPACES.length;q++) before.push(S.sp[q]?1:0);
    acTurnSteps(S);
    for(var q2=0;q2<SPACES.length;q2++) if(!before[q2] && S.sp[q2]) moved=true;
  } else {
    while(guard++<8){
      var mv = botPick(S);
      if(!mv){ LOG(S,'sys', TF('lgNoMove', S.ai)); }
      else { placeToken(S, S.ai, mv.sp, mv.h, mv.o, false, {auto:true}); moved=true; }
      if(S.over) break;
      endTurnDraw(S, S.ai);
      if(S.extra){ S.extra=0; continue; }
      break;
    }
  }
  if(moved) S.skips=0; else { S.skips=(S.skips||0)+1; if(S.skips>=4){ endStuck(); return; } }
  if(S.over){ renderAll(); return; }
  S.turn = S.me;
  renderAll();
  setTimeout(beginTurn, 120);
}

/* ---- board interaction ---- */
function bindBoard(){
  var svg=document.querySelector('svg.board'); if(!svg) return;
  svg.addEventListener('click', function(e){
    var g=e.target.closest('[data-s]');
    if(g){
      var i=+g.getAttribute('data-s');
      if(g.classList.contains('legal')){ UI.selSp=i; renderAll(); return; }
      showTipFor(e, 'space', i); return;
    }
    var pp=e.target.closest('[data-p]');
    if(pp) showTipFor(e, 'prov', +pp.getAttribute('data-p'));
  });
  svg.addEventListener('mousemove', function(e){
    var g=e.target.closest('[data-s]');
    if(g){ showTipFor(e,'space', +g.getAttribute('data-s')); return; }
    var pp=e.target.closest('[data-p]');
    if(pp){ showTipFor(e,'prov', +pp.getAttribute('data-p')); return; }
    hideTip();
  });
  svg.addEventListener('mouseleave', hideTip);
}
function hideTip(){ var t=document.getElementById('tip'); if(t) t.style.display='none'; }
function showTipFor(e, kind, i){
  var t=document.getElementById('tip'); if(!t||!S) return;
  var h='';
  if(kind==='space'){
    var pa=SPACES[i][3], pb=SPACES[i][4], o=S.sp[i];
    h='<b>'+iconName(SPACES[i][2])+'</b><br>'+PN(pa)+' &harr; '+PN(pb);
    if(SPACES[i][5]) h+='<br><i>'+T('ttBC')+'</i>';
    if(o){
      h+='<br>'+sideName(o.s)+': ';
      if(o.d) h+=T('ttFacedown');
      else if(o.f) h+=T('ttFlipped');
      else h+=PN(pa)+' '+o.a+', '+PN(pb)+' '+o.b;
    } else h+='<br>'+T('ttFree');
    if(S.spCtrl[i]>=0) h+='<br>'+T('ttCtrl')+': '+sideName(S.spCtrl[i]);
  } else {
    var t2=influence(S,i);
    h='<b>'+PN(i)+'</b><br>'+(S.closed[i]? T('ttClosedP') : T('ttOpen')+', '+freeSpaces(S,i)+' '+T('ttFreeSp'));
    h+='<br>'+T('ttInf')+': '+sideName(0)+' '+t2[0]+' &middot; '+sideName(1)+' '+t2[1];
    h+='<br>'+T('ttBonus')+': '+(S.bonusAt[i]? bonusName(S.bonusAt[i]) : T('ttNone'));
    if(S.owner[i]>=0) h+='<br>'+T('ttCtrl')+': '+sideName(S.owner[i]);
  }
  t.innerHTML=h; t.style.display='block';
  var x=e.clientX+14, y=e.clientY+14;
  if(x+250>window.innerWidth) x=window.innerWidth-258;
  if(y+120>window.innerHeight) y=window.innerHeight-128;
  t.style.left=x+'px'; t.style.top=y+'px';
}

/* ---- modal helpers ---- */
function closeOvl(){ document.getElementById('ovl').innerHTML=''; }
function modal(title, body, foot){
  document.getElementById('ovl').innerHTML =
    '<div class="ovl" onclick="if(event.target===this)closeOvl()"><div class="modal">'
    + '<div class="mhead"><h2>'+title+'</h2><button class="btn" onclick="closeOvl()">&#10005;</button></div>'
    + body + (foot||'') + '</div></div>';
}

/* ---- setup ---- */
var SETUP = {side:0, bot:'ac', diff:1, poison:false, cent:false, border:false, brutal:false};
function openSetup(){ drawSetup(); }
function setOpt(k,v){
  SETUP[k]=v;
  if(k==='poison'||k==='cent'){ if(!SETUP.poison && !SETUP.cent) SETUP.border=false; }
  if(k==='border' && !SETUP.poison && !SETUP.cent) SETUP.border=false;
  drawSetup();
}
function chip(k,v,label,desc,on){
  return '<button class="chip'+(on?' on':'')+'" onclick="setOpt(\''+k+'\','+(typeof v==='string'?"'"+v+"'":v)+')">'+label
    + (desc?'<small>'+desc+'</small>':'')+'</button>';
}
function drawSetup(){
  var b='<div class="mbody">';
  b+='<div class="optrow"><label>'+T('optSide')+'</label><div class="chips">'
    + chip('side',0,T('sideCaesar'),'',SETUP.side===0)
    + chip('side',1,T('sidePompey'),'',SETUP.side===1)
    + '</div><div class="mini" style="margin-top:5px">'+T('sideNote')+'</div></div>';
  b+='<div class="optrow"><label>'+T('optBot')+'</label><div class="chips">'
    + chip('bot','ac',T('botAC'),T('botACd'),SETUP.bot==='ac')
    + chip('bot','strat',T('botStrat'),T('botStratd'),SETUP.bot==='strat')
    + chip('bot','novice',T('botNovice'),T('botNoviced'),SETUP.bot==='novice')
    + '</div></div>';
  b+='<div class="optrow"><label>'+T('optDiff')+'</label><div class="chips">'
    + chip('diff',0,T('diffEasy'),'',SETUP.diff===0)
    + chip('diff',1,T('diffNorm'),'',SETUP.diff===1)
    + chip('diff',2,T('diffHard'),'',SETUP.diff===2)
    + '</div></div>';
  if(SETUP.bot==='ac'){
    b+='<div class="optrow"><label>'+T('optVariant')+'</label><div class="chips">'
      + chip('brutal',!SETUP.brutal,T('optBrutal'),T('optBrutalD'),SETUP.brutal)
      + '</div></div>';
  }
  b+='<div class="optrow"><label>'+T('optExp')+'</label><div class="chips">'
    + chip('poison',!SETUP.poison,T('expPoison'),T('expPoisond'),SETUP.poison)
    + chip('cent',!SETUP.cent,T('expCent'),T('expCentd'),SETUP.cent)
    + chip('border',!SETUP.border,T('expBorder'),(SETUP.poison||SETUP.cent)?T('expBorderd'):T('expBorderNeed'),SETUP.border)
    + '</div></div>';
  b+='</div>';
  var foot='<div class="mbody" style="border-top:2px solid var(--line);text-align:right">'
    +'<button class="btn prim" onclick="startGame()">'+T('setupStart')+'</button></div>';
  modal(T('setupTitle'), b, foot);
}
function startGame(){
  closeOvl();
  S = newState({side:SETUP.side, bot:SETUP.bot, diff:SETUP.diff, brutal:SETUP.brutal && SETUP.bot==='ac',
                poison:SETUP.poison, cent:SETUP.cent, border:SETUP.border});
  S.skips=0;
  var nm = SETUP.bot==='ac'?T('botAC'):(SETUP.bot==='strat'?T('botStrat'):T('botNovice'));
  LOG(S,'sys', TF('lgStart', nm, [T('diffEasy'),T('diffNorm'),T('diffHard')][SETUP.diff]));
  LOG(S,'sys', TF('lgFirst', S.ai));
  UI.sel=-1; UI.selSp=-1;
  renderAll();
  setTimeout(beginTurn, 420);
}

/* ---- persistence ---- */
function save(){
  try{
    if(S) localStorage.setItem('caesarSolo', JSON.stringify({s:S, setup:SETUP}));
    localStorage.setItem('caesarLang', LANG);
  }catch(e){}
}
function load(){
  try{
    var l=localStorage.getItem('caesarLang'); if(l) LANG=l;
    var raw=localStorage.getItem('caesarSolo'); if(!raw) return false;
    var o=JSON.parse(raw);
    if(!o||!o.s) return false;
    S=o.s; if(o.setup) SETUP=o.setup;
    if(S.skips===undefined) S.skips=0;
    return true;
  }catch(e){ return false; }
}

'<tr><td>C</td><td>Húz 2, lehelyez 2</td></tr>'+
'<tr><td>D</td><td>Húz 1 centuriót, lehelyez 1 (csak Centuriókkal)</td></tr>'+
'<tr><td>E</td><td>Húz 1 és 1 centuriót, lehelyez 2 (csak Centuriókkal)</td></tr></table>'+
'<p>Nehézségi összetétel alapjátékban: könnyű 4A 2B, normál 3A 2B 1C, nehéz 4A 2C. '+
'Centuriókkal: könnyű 4A 1B 1D, normál 2A 2B 1C 1D, nehéz 4A 1C 1E.</p>'+
'<h4>Lehelyezési prioritás</h4><ol>'+
'<li>Ha meg tud nyerni egy provinciát, a legkisebb ehhez elég értékkel zárja le.</li>'+
'<li>Ha le tud zárni egy provinciát úgy is, hogy elveszíti, a legkisebb értékkel megteszi, kivéve ha ezzel te nyernéd meg a játékot.</li>'+
'<li>Ha van olyan nyitott provincia, ahol vesztésre áll, a legnagyobb hátránynál lévőbe rakja a legnagyobb értékét.</li>'+
'<li>Ha van olyan nyitott provincia, ahol jelen van, a győzelemhez legközelebbibe rakja a legnagyobb értékét.</li>'+
'<li>Egy általa már ellenőrzött provincia szomszédjába rakja a legnagyobb értékét.</li>'+
'<li>Belső provinciába rakja a legnagyobb értékét (döntetlennél Italia).</li>'+
'<li>Bármelyik maradék provinciába rakja a legnagyobb értékét.</li></ol>'+
'<p><b>Döntetlenoldás provinciák között:</b> már megnyert provincia szomszédja, Szenátus bónusz, Méreg bónusz, belső provincia, belső provincia szomszédja, véletlen. '+
'<b>Mezők között:</b> az a mező, ami olyan provinciát is érint, ahol a legnagyobb a hátránya, majd belső provincia melletti mező, majd véletlen. '+
'<b>Jelzők között:</b> nem joker a joker előtt, majd a legnagyobb vagy legkisebb összérték, majd a sor bal széléről.</p>'+
'<p>Erő, Gazdagság, Taktika és Centurio bónuszt Auto-Crassus csak félreteszi. Szenátust és Mérget normálisan kijátssza. '+
'A szabálykönyv "még nehezebb játék" opciója külön kapcsolható az Új játék ablakban (Kegyetlen Crassus): ilyenkor, ha egy félretett bónusszal együtt a provinciát is megnyerte, két kijátszatlan ellenőrző jelzőt kivesz a játékból.</p>'+
'<h4>Stratéga</h4><p>Saját fejlesztésű kereső. Minden lehetséges jelző, mező és állás kombinációt végigszimulál egy lépés mélyen, '+
'és pozíciót értékel: ellenőrző jelző különbség, provinciánként a várható többség a még megszerezhető értékkel súlyozva, szomszédsági bónusz, Szenátus jelzők. '+
'Emberi szabályokkal játszik, tehát döntetlennél nem ő nyer, és rendesen kijátssza az Erő bónuszt is. '+
'A nehézség azt szabja meg, hányadik legjobb lépésig választhat véletlenszerűen.</p>'+
'<h4>Novícius</h4><p>Tanuló ellenfél. A kereső rangsorából széles sávból választ véletlenszerűen, a nehézség szűkíti ezt a sávot.</p>'+'<h4>Mért egyensúly</h4><p>Beállításonként 100 automatikus játék, a játékost a legerősebb kiértékelő játszotta. A szám a játékos győzelmi aránya, tehát minél kisebb, annál nehezebb az ellenfél.</p>'+'<table><tr><th>Ellenfél</th><th>Könnyű</th><th>Normál</th><th>Nehéz</th></tr>'+'<tr><td>Auto-Crassus</td><td>64%</td><td>33%</td><td>22%</td></tr>'+'<tr><td>Auto-Crassus, kegyetlen</td><td>30%</td><td>24%</td><td>2%</td></tr>'+'<tr><td>Stratéga</td><td>84%</td><td>57%</td><td>22%</td></tr>'+'<tr><td>Novícius</td><td>99%</td><td>97%</td><td>72%</td></tr></table>'+'<p class="mini">Auto-Crassus fokozatai a hivatalos parancslapka összetételből jönnek, ezeket nem hangoltam át. A Stratéga és a Novícius fokozatait szimulációval állítottam be.</p>';

RULES.hu.diff =
'<h4>Eltérések a papírszabálytól</h4>'+
'<p>Az alapjáték és a kiegészítők szabályai hiánytalanul benne vannak. Ahol a papírszabály nem egyértelmű vagy interaktív döntést kérne, ott a következő értelmezéseket használom:</p><ol>'+
'<li><b>Belső provincia.</b> A szabálykönyv nem sorolja fel őket. Azokat vettem belsőnek, amiket minden oldalról más provincia zár körbe: Italia, Sardinia, Sicilia, Achaia, Creta.</li>'+
'<li><b>"A győzelemhez legközelebb".</b> Auto-Crassus 4. pontját úgy értelmezem, hogy a legszorosabb nyitott provinciát választja, ahol jelen van és legalább döntetlenre áll, azonos esetben a kevesebb szabad mezővel rendelkezőt.</li>'+
'<li><b>"A győzelemhez elég legkisebb érték".</b> Ha a jelző kisebbik számával is nyer, azt fordítja befelé, ha nem, a nagyobbikat.</li>'+
'<li><b>Erő bónusz.</b> Neked kell célpontot választanod. Auto-Crassus a szólószabály szerint csak félreteszi. A Stratéga és a Novícius kijátssza, célpontot a motor választ.</li>'+
'<li><b>Szenátus a Határellenőrzésből.</b> A félretett pakliból húzott Szenátus jelzőnél nincs kapcsolódó provincia, így a jelzőt megkapod, de nem kerül alá ellenőrző jelző.</li>'+
'<li><b>Nincs szabályos lehelyezés.</b> A papírszabály erről nem rendelkezik. Ilyenkor a lehelyezés kimarad. Négy egymást követő kimaradás után a játék véget ér, és az nyer, aki több ellenőrző jelzőt rakott le.</li>'+
'<li><b>Döntetlen az ellenőrzési erőben.</b> Csak a hivatalos Auto-Crassus nyeri meg a döntetlent. A Stratéga és a Novícius ellen a mező üresen marad, ahogy a kétszemélyes játékban.</li>'+
'<li><b>Méreg vesztési feltétel.</b> Auto-Crassusra is alkalmazom, bár az ő jelzői nyíltan állnak, nem paraván mögött.</li>'+
'<li><b>"Még nehezebb játék" opció.</b> Külön kapcsolóként építettem be (Kegyetlen Crassus), mert a nehéz fokozatba olvasztva a mérések szerint túl erőssé tette a gépet.</li>'+'<li><b>Döntetlenoldás sorrendje.</b> A szabálykönyv külön listázza a provincia, a mező és a jelző döntetlenoldókat, de nem mondja meg, melyik a rangsor teteje. Én a provinciát választom először, aztán a mezőt, végül a jelzőt, ahogy a folyamatábra is felépül.</li>'+
'<li><b>Grafika.</b> A tábla saját, vektoros rajz. A provinciák elrendezése, a szomszédságok, a 30 határmező ikonjai és a 3 dupla keretes mező pontosan a nyomtatott tábláé, de az eredeti illusztrációt nem másolom le. Ezért a kapott fényképeket sem ágyaztam be.</li>'+
'<li><b>Provincia bónuszok.</b> A papírjátékban is képpel felfelé állnak, így a digitális változatban is végig láthatóak.</li>'+
'</ol>';

/* ---------------- EN ---------------- */
RULES.en.over =
'<h4>The game</h4><p>The last days of the Roman Republic. Caesar and Pompey fight for control of the provinces. '+
'The first player to place all 12 Control markers wins and is probably the first Dictator of Rome.</p>'+
'<h4>Solo game</h4><p>You play Caesar or Pompey against Auto-Crassus, the third member of the Triumvirate. '+
'Auto-Crassus takes the first turn, plays with an open hand and always wins ties for control strength.</p>'+
'<h4>The map</h4><ul>'+
'<li><b>18 provinces</b>, each with a <b>Province space</b>. Italia has two, the solid bordered one starts with a Senate bonus.</li>'+
'<li><b>30 Border spaces</b>, each touching exactly two provinces. Icons are gladius, navis or signum, ten of each.</li>'+
'<li>At setup the other 17 Province spaces each get a random Province Bonus token face up.</li>'+
'</ul>';
RULES.en.turn =
'<h4>On your turn</h4><ol>'+
'<li><b>Place an Influence token</b> on a free Border space with a matching icon. Laurel tokens are wild. '+
'You choose the orientation, that is which of the two numbers faces which adjacent province.</li>'+
'<li><b>If all Border spaces around one or more provinces are occupied</b>, those provinces are <b>closed</b>:<ul>'+
'<li>The player who placed the last Influence token <b>takes the Province Bonus token</b> from all provinces closed this way.</li>'+
'<li>Add up each player influence on each closed province. The highest total places a <b>Control marker</b> in the empty Province space. On a <b>tie</b> the space stays empty. (Auto-Crassus always wins ties.)</li>'+
'<li>If the province is <b>Italia</b>, the controlling player places a second Control marker on the second space.</li>'+
'<li>If one or more <b>adjacent provinces are controlled by the same player</b>, an additional Control marker is placed on the Border space between them, covering the token there.</li>'+
'<li>The player who took the bonus token now <b>resolves its effect</b>.</li></ul></li>'+
'<li><b>Draw a new Influence token</b> from your bag.</li></ol>'+
'<div class="note">Several provinces can close at once. Bonuses always go to the player who placed the token, control goes to the player with more influence.</div>';
RULES.en.space =
'<h4>Provinces</h4><p>Every province is surrounded by Border spaces and every Border space touches exactly two provinces. '+
'A province closes when the last of its surrounding Border spaces is filled.</p>'+
'<h4>Influence</h4><p>Your influence in a province is the sum of the numbers of your tokens <b>facing that province</b>. '+
'Flipped and face down tokens contribute 0.</p>'+
'<h4>Land locked provinces</h4><p>Five provinces are fully enclosed by other provinces: <b>Italia, Sardinia, Sicilia, Achaia, Creta</b>. '+
'The Auto-Crassus priority list treats these as land locked.</p>'+
'<h4>Help</h4><p>Hover a space or a province (tap on mobile) to see the detailed standing.</p>';
RULES.en.tok =
'<h4>Influence tokens</h4><p>Each side starts with 16 basic tokens: gladius, navis and signum in <b>6/0, 5/1, 4/2, 3/3</b>, '+
'plus 4 wild laurel tokens: <b>4/0, 3/1, 2/2, 2/2</b>. The Centurions expansion adds 3 stronger tokens: <b>7/0 gladius, 4/4 with all three icons, 3/3 laurel</b>.</p>'+
'<p>Starting hand is 2, or 3 with Poison. Auto-Crassus always keeps 3 face up tokens.</p>';
RULES.en.bonus =
'<h4>Province Bonus tokens</h4><p>At setup a Senate token goes on the solid bordered Italia space, the remaining 17 are dealt randomly to the other provinces. '+
'Base game: Tactics 4, Wealth 4, Might 4, Senate 6 (one of them on Italia).</p>'+
'<table><tr><th>Bonus</th><th>Effect</th></tr>'+
'<tr><td><b>'+I18N.en.btactics+'</b></td><td>'+I18N.en.btacticsD+'</td></tr>'+
'<tr><td><b>'+I18N.en.bwealth+'</b></td><td>'+I18N.en.bwealthD+'</td></tr>'+
'<tr><td><b>'+I18N.en.bmight+'</b></td><td>'+I18N.en.bmightD+'</td></tr>'+
'<tr><td><b>'+I18N.en.bsenate+'</b></td><td>'+I18N.en.bsenateD+'</td></tr>'+
'<tr><td><b>'+I18N.en.bpoison+'</b></td><td>'+I18N.en.bpoisonD+'</td></tr>'+
'<tr><td><b>'+I18N.en.bcenturion+'</b></td><td>'+I18N.en.bcenturionD+'</td></tr></table>'+
'<div class="note">Senate is the fastest route to victory. A third Senate token taken together with a won province means three extra Control markers.</div>';
RULES.en.exp =
'<h4>Expansions of Rome</h4><p>Each expansion can be switched on separately in the New game window.</p>'+
'<h4>Poison</h4><ul><li>3 Poison bonus tokens are mixed in, then 3 random bonus tokens are removed from play.</li>'+
'<li>Everyone starts with 3 tokens behind their screen.</li>'+
'<li>When someone gains Poison, their opponent returns a random token from hand to their bag.</li>'+
'<li>Starting your turn with an empty hand loses the game immediately.</li></ul>'+
'<h4>Centurions</h4><ul><li>3 Centurion bonus tokens are mixed in, then 3 random bonus tokens are removed.</li>'+
'<li>Both sides get 3 Centurion Influence tokens.</li>'+
'<li>Gaining a Centurion bonus lets you take one of your Centurion tokens, and your next draw is skipped.</li>'+
'<li>In solo the Command tile mix changes and the Auto-Crassus Centurion stack is face down.</li></ul>'+
'<h4>Border Control</h4><ul><li>Requires Poison or Centurions.</li>'+
'<li>Spare bonus tokens are not removed but set aside face down.</li>'+
'<li>On the 3 double lined Border spaces you may place a token face down. It exerts no influence, but you immediately draw and resolve a set aside bonus.</li>'+
'<li>Auto-Crassus never places face down.</li></ul>';
RULES.en.end =
'<h4>Game end</h4><p>The game ends immediately when a player places their <b>last, twelfth Control marker</b> on the map or under a Senate token. That player wins.</p>'+
'<h4>Where Control markers go</h4><ul>'+
'<li>On the empty Province space of a closed province you have the majority in.</li>'+
'<li>On the second Italia space if you won Italia.</li>'+
'<li>On the Border space between two adjacent provinces you control.</li>'+
'<li>Under a Senate token, as many as the number of Senate tokens you own, if you also won that province.</li></ul>'+
'<p>With Poison you also lose by starting your turn with an empty hand.</p>';
RULES.en.ai =
'<h4>Auto-Crassus (official)</h4><p>The solo module from the box. It keeps 3 Influence tokens face up in a line. '+
'Each turn it draws a <b>Command tile</b> and performs it in order:</p>'+
'<table><tr><th>Tile</th><th>Actions</th></tr>'+
'<tr><td>A</td><td>Draw 2, resolve 1 placement, then return the left most token to the bag</td></tr>'+
'<tr><td>B</td><td>Draw 1, resolve 1 placement</td></tr>'+
'<tr><td>C</td><td>Draw 2, resolve 2 placements</td></tr>'+
'<tr><td>D</td><td>Draw 1 Centurion, resolve 1 (Centurions only)</td></tr>'+
'<tr><td>E</td><td>Draw 1 and 1 Centurion, resolve 2 (Centurions only)</td></tr></table>'+
'<p>Base mixes: easy 4A 2B, normal 3A 2B 1C, hard 4A 2C. With Centurions: easy 4A 1B 1D, normal 2A 2B 1C 1D, hard 4A 1C 1E.</p>'+
'<h4>Placement priority</h4><ol>'+
'<li>If it can win a province, it closes it with the lowest value that still wins.</li>'+
'<li>If it can close a province even while losing it, it uses its lowest value, unless that would let you win the game.</li>'+
'<li>If it is losing any open province, it puts its highest value into the one it is losing the most.</li>'+
'<li>If it is present in any open province, it puts its highest value into the one it is closest to winning.</li>'+
'<li>It plays next to a province it already controls, with its highest value.</li>'+
'<li>It plays in a land locked province with its highest value (tie: Italia).</li>'+
'<li>It plays in any remaining province with its highest value.</li></ol>'+
'<p><b>Province ties:</b> next to a province already won, Senate bonus, Poison bonus, land locked, next to land locked, random. '+
'<b>Space ties:</b> the space also touching the province it is losing the most, then next to a land locked province, then random. '+
'<b>Token ties:</b> non wild before wild, then highest or lowest combined value, then left most in the line.</p>'+
'<p>Auto-Crassus only sets Might, Wealth, Tactics and Centurion aside. Senate and Poison are resolved normally. '+
'The rulebook even harder option is a separate switch in the New game window (Ruthless Crassus): when it sets a bonus aside and also won that province, it removes two unplayed Control markers from the game.</p>'+
'<h4>Strategist</h4><p>A custom search engine. It simulates every token, space and orientation combination one ply deep and scores the result: '+
'Control marker difference, expected majority per province weighted by what is still at stake, adjacency bonuses and Senate tokens. '+
'It plays by human rules, so it does not win ties and it does use the Might bonus. Difficulty sets how far down the ranked move list it may pick randomly.</p>'+
'<h4>Novice</h4><p>A learning opponent. It picks randomly from a wide band of the ranked move list, the difficulty narrows that band.</p>'+'<h4>Measured balance</h4><p>100 automatic games per setting, with the player seat driven by the strongest evaluator. The number is the player win rate, so lower means a tougher opponent.</p>'+'<table><tr><th>Opponent</th><th>Easy</th><th>Normal</th><th>Hard</th></tr>'+'<tr><td>Auto-Crassus</td><td>64%</td><td>33%</td><td>22%</td></tr>'+'<tr><td>Auto-Crassus, ruthless</td><td>30%</td><td>24%</td><td>2%</td></tr>'+'<tr><td>Strategist</td><td>84%</td><td>57%</td><td>22%</td></tr>'+'<tr><td>Novice</td><td>99%</td><td>97%</td><td>72%</td></tr></table>'+'<p class="mini">The Auto-Crassus levels come from the official Command tile mixes and were not retuned. Strategist and Novice levels were set by simulation.</p>';
RULES.en.diff =
'<h4>Deviations from the paper rules</h4>'+
'<p>The base game and all three expansions are implemented in full. Where the printed rules are ambiguous or would need an interactive decision, these readings are used:</p><ol>'+
'<li><b>Land locked provinces.</b> The rulebook does not list them. Taken as the provinces fully enclosed by other provinces: Italia, Sardinia, Sicilia, Achaia, Creta.</li>'+
'<li><b>"Closest to winning".</b> Step 4 of Auto-Crassus is read as the tightest open province where it is present and at least level, ties broken by fewer free spaces.</li>'+
'<li><b>"Lowest value required to win".</b> If the lower number of the token still wins, that side faces in, otherwise the higher one.</li>'+
'<li><b>Might.</b> You choose the target. Auto-Crassus only sets it aside, as the solo rules state. Strategist and Novice do use it, with an engine chosen target.</li>'+
'<li><b>Senate from Border Control.</b> A Senate token drawn from the set aside pool has no associated province, so you gain the token but place no Control markers under it.</li>'+
'<li><b>No legal placement.</b> The paper rules are silent. The placement is skipped. After four consecutive skips the game ends and whoever placed more Control markers wins.</li>'+
'<li><b>Ties for control.</b> Only the official Auto-Crassus wins ties. Against Strategist and Novice the space stays empty, as in the two player game.</li>'+
'<li><b>Poison loss condition.</b> Applied to Auto-Crassus too, even though its tokens sit face up in a play area rather than behind a screen.</li>'+
'<li><b>"Even harder game" option.</b> Built in as a separate switch (Ruthless Crassus), because folding it into the hard level measured as far too strong.</li>'+'<li><b>Tie breaker order.</b> The rulebook lists province, space and token tie breakers separately but does not say which comes first. Province is resolved first, then space, then token, following the shape of the flowchart.</li>'+
'<li><b>Graphics.</b> The map is original vector artwork. Province layout, adjacencies, the 30 Border space icons and the 3 double lined spaces match the printed board exactly, but the original illustration is not reproduced, which is also why the supplied photographs are not embedded.</li>'+
'<li><b>Province bonuses.</b> They are face up in the paper game too, so they stay visible here.</li>'+
'</ol>';
</script>
<script>
/* ==================== RULES CONTENT ==================== */
function iconRow(kind,name,desc){
  return '<div class="lg">'+iconTag(kind, kind==='any'?34:24,'var(--ink)')+'<div><b>'+name+'</b><br><span class="mini">'+desc+'</span></div></div>';
}
function tabIcons(){
  var o='<h4>'+T('tabIcons0')+'</h4><div class="legend">';
  o+=iconRow('sw',T('icsw'),T('icswD'));
  o+=iconRow('sh',T('icsh'),T('icshD'));
  o+=iconRow('st',T('icst'),T('icstD'));
  o+=iconRow('wd',T('icwd'),T('icwdD'));
  o+=iconRow('any',T('icany'),T('icanyD'));
  o+='</div><h4>'+T('tabBonus')+'</h4><div class="legend">';
  o+=iconRow('senate',T('bsenate')+' [6]',T('bsenateD'));
  o+=iconRow('tactics',T('btactics')+' [4]',T('btacticsD'));
  o+=iconRow('wealth',T('bwealth')+' [4]',T('bwealthD'));
  o+=iconRow('might',T('bmight')+' [4]',T('bmightD'));
  o+=iconRow('poison',T('bpoison')+' [3]',T('bpoisonD'));
  o+=iconRow('centurion',T('bcenturion')+' [3]',T('bcenturionD'));
  o+='</div>';
  o+='<h4>'+T('tabIcons1')+'</h4><div class="legend">'
   +'<div class="lg"><svg width="26" height="26" viewBox="0 0 26 26">'+ctrlMarker(13,13,11,0,0)+'</svg><div><b>'+T('ttCtrl')+'</b><br><span class="mini">'+T('rCtrlD')+'</span></div></div>'
   +'<div class="lg"><svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="var(--gold2)" stroke="var(--stroke)" stroke-width="2"/></svg><div><b>'+T('rProvSp')+'</b><br><span class="mini">'+T('rProvSpD')+'</span></div></div>'
   +'<div class="lg"><svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="none" stroke="var(--stroke)" stroke-width="2" stroke-dasharray="3 2.5"/></svg><div><b>'+T('rItalia2')+'</b><br><span class="mini">'+T('rItalia2D')+'</span></div></div>'
   +'<div class="lg"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13.5" fill="none" stroke="var(--stroke)" stroke-width="1.4"/><circle cx="15" cy="15" r="10.5" fill="#f7f2e7" stroke="var(--stroke)" stroke-width="2"/></svg><div><b>'+T('ttBC')+'</b><br><span class="mini">'+T('rBCD')+'</span></div></div>'
   +'</div>';
  return o;
}
var RTABS = ['over','turn','space','tok','bonus','exp','end','ai','diff'];
function rulesBody(tab){
  if(tab==='icons') return tabIcons();
  if(tab==='tok') return RULES[LANG].tok + tabIcons();
  return (RULES[LANG]||RULES.en)[tab] || '';
}
var CURTAB='over';
function openRules(tab){
  CURTAB = tab||'over';
  var tabs='<div class="tabs">';
  var list=['over','turn','space','icons','tok','bonus','exp','end','ai','diff'];
  var lab={over:'tabOver',turn:'tabTurn',space:'tabSpace',icons:'btnIcons',tok:'tabTok',bonus:'tabBonus',exp:'tabExp',end:'tabEnd',ai:'tabAI',diff:'tabDiff'};
  for(var i=0;i<list.length;i++)
    tabs+='<button class="'+(list[i]===CURTAB?'on':'')+'" onclick="openRules(\''+list[i]+'\')">'+T(lab[list[i]])+'</button>';
  tabs+='</div>';
  modal(T('rulesTitle'), tabs+'<div class="mbody">'+rulesBody(CURTAB)+'</div>');
}

/* ==================== LANGUAGE ==================== */
function setLang(l){
  LANG=l;
  document.getElementById('lhu').className = l==='hu'?'on':'';
  document.getElementById('len').className = l==='en'?'on':'';
  document.documentElement.lang = l;
  var els=document.querySelectorAll('[data-i]');
  for(var i=0;i<els.length;i++) els[i].innerHTML = T(els[i].getAttribute('data-i'));
  var ovl=document.getElementById('ovl');
  if(ovl.innerHTML){
    if(ovl.innerHTML.indexOf('class="tabs"')>=0) openRules(CURTAB); else drawSetup();
  }
  renderAll();
}

/* ==================== INIT ==================== */
(function(){
  var had = load();
  setLang(LANG);
  if(had && S && !S.over){
    renderAll();
    if(S.turn!==S.me && !S.pending) setTimeout(beginTurn, 500);
  } else if(had && S){
    renderAll(); openSetup();
  } else {
    renderAll(); openSetup();
  }
  window.addEventListener('scroll', hideTip, {passive:true});
})();
</script>

</body>
</html>
