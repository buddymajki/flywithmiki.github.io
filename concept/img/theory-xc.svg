  <rect x="268" y="214" width="118" height="32" rx="16" fill="#0d2436"/>
  <text x="327" y="235" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="bold" font-size="14" fill="#fff">52 km FAI</text>
