    <path d="M20 95 C80 65 140 115 210 85 S330 45 390 80"/>
    <path d="M0 130 C70 105 150 150 220 120 S340 90 400 115"/>
    <path d="M30 170 C90 150 160 185 230 160 S340 135 395 155"/>
    <path d="M5 215 C80 190 150 245 245 215 S360 185 400 205"/>
  </g>
  <!-- lake and valley road -->
  <path d="M250 150 C270 135 310 140 320 158 C330 178 290 190 265 182 C245 176 238 160 250 150Z" fill="#9cc9e3"/>
  <path d="M0 150 C90 140 160 160 240 155 S350 150 400 140" fill="none" stroke="#c9b48a" stroke-width="3" stroke-dasharray="1 0"/>
