  <path d="M70 185 L170 55 L340 95 L70 185" fill="rgba(232,93,4,0.08)" stroke="#e85d04" stroke-width="3.5" stroke-linejoin="round"/>
  <g stroke="#e85d04" stroke-width="3">
    <path d="M118 122 l9 -3 l-2 9" fill="none"/>
    <path d="M258 76 l8 4 l-7 6" fill="none"/>
    <path d="M200 142 l-9 -1 l5 -8" fill="none"/>
  </g>
  <!-- turnpoints -->
  <g font-family="Montserrat, Arial, sans-serif" font-weight="bold" font-size="13">
    <circle cx="170" cy="55" r="9" fill="#fff" stroke="#0d2436" stroke-width="3"/>
    <text x="184" y="48" fill="#0d2436">TP1</text>
    <circle cx="340" cy="95" r="9" fill="#fff" stroke="#0d2436" stroke-width="3"/>
    <text x="318" y="78" fill="#0d2436">TP2</text>
    <circle cx="70" cy="185" r="6" fill="#0f8b8d"/>
    <text x="40" y="226" fill="#0f8b8d">START</text>
