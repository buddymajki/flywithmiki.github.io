<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2436"/>
      <stop offset="1" stop-color="#0f4c5c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#sky)"/>
  <!-- gauge -->
  <g fill="none" stroke-width="26" stroke-linecap="butt">
    <path d="M90 200 A110 110 0 0 1 145 104.7" stroke="#1f9d55"/>
    <path d="M145 104.7 A110 110 0 0 1 255 104.7" stroke="#ffd166"/>
    <path d="M255 104.7 A110 110 0 0 1 310 200" stroke="#d64545"/>
  </g>
  <g stroke="#0d2436" stroke-width="3">
    <line x1="145" y1="104.7" x2="132" y2="82"/>
    <line x1="255" y1="104.7" x2="268" y2="82"/>
  </g>
  <!-- needle -->
  <line x1="200" y1="200" x2="148" y2="122" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="200" r="14" fill="#fff"/>
  <circle cx="200" cy="200" r="6" fill="#0d2436"/>
  <!-- labels -->
  <g font-family="Montserrat, Arial, sans-serif" font-weight="bold" font-size="15" text-anchor="middle">
    <text x="86" y="232" fill="#9fe7e1">GO</text>
    <text x="200" y="40" fill="#ffd166">THINK</text>
    <text x="314" y="232" fill="#f3a6a6">NO GO</text>
  </g>
  <!-- small windsock -->
  <g transform="translate(330 46)">
    <line x1="0" y1="0" x2="0" y2="46" stroke="#fff" stroke-width="3"/>
    <path d="M0 2 L34 7 L34 17 L0 22Z" fill="#e85d04"/>
    <path d="M12 3.8 L12 20.2 M23 5.4 L23 18.6" stroke="#fff" stroke-width="3"/>
  </g>
</svg>
